<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartLearn AI - Academic Selection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="selection-page">

        <!-- Header -->
        <header class="selection-header">

            <div class="brand">
                <div class="brand-logo">S</div>
                <div class="brand-name">SmartLearn AI</div>
            </div>

            <div class="selection-step">
                STEP 2 OF 3
            </div>

        </header>


        <!-- Main -->
        <main class="selection-container">

            <div class="selection-intro">

                <span class="selection-tag">
                    PERSONALIZE YOUR LEARNING
                </span>

                <h1 id="selectionTitle">
                    Tell Us More About You 🎓
                </h1>

                <p id="selectionDescription">
                    Select your academic details to create
                    your personalized learning experience.
                </p>

            </div>


            <!-- Dynamic Content -->
            <section id="selectionContent">

                <!-- JavaScript will create the options here -->

            </section>


            <!-- Message -->
            <p
                id="selectionMessage"
                class="selection-message"
            >
                Please make your selection
            </p>


            <!-- Buttons -->
            <div class="selection-actions">

                <button
                    type="button"
                    class="back-btn"
                    onclick="window.location.href='education-selection.html'"
                >
                    ← Back
                </button>

                <button
                    type="button"
                    id="continueSelectionBtn"
                    class="continue-btn"
                    disabled
                >
                    Continue →
                </button>

            </div>

        </main>


        <!-- Footer -->
        <footer class="selection-footer">

            <p>
                SmartLearn AI • Learning Intelligence System
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
